# LiteLLM Proxy Configuration
# Provides a unified gateway for multiple AI model providers
# See: https://docs.litellm.ai/docs/simple_proxy

# General Settings
general_settings:
  # Master key for authentication - CHANGE IN PRODUCTION!
  # Use a strong, randomly generated key for security
  master_key: sk-dummy

# LiteLLM Behavior Settings
litellm_settings:
  # Drop unsupported parameters instead of erroring
  drop_params: true
  # Modify parameters to match provider expectations
  modify_params: true

# Model List Configuration
# Each entry defines how to route model requests
model_list:
# GPT-5.1 Codex - Standard reasoning model
- model_name: gpt-5.1-codex
  model_info:
    mode: responses
    supports_vision: true
  litellm_params:
    # Route through GitHub Copilot
    model: github_copilot/gpt-5.1-codex
    drop_params: true
    # Headers required for GitHub Copilot compatibility
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"

# GPT-5.1 Codex Max - Enhanced reasoning model
- model_name: gpt-5.1-codex-max
  model_info:
    mode: responses
    supports_vision: true
  litellm_params:
    model: github_copilot/gpt-5.1-codex-max
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"

# Claude Opus 4.5 - Anthropic's flagship model
- model_name: claude-opus-4.5
  litellm_params:
    model: github_copilot/claude-opus-4.5
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"

# Wildcard route - Catch-all for any GitHub Copilot model
# Allows dynamic model selection without config changes
- model_name: "*"
  litellm_params:
    model: "github_copilot/*"
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
